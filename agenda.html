<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horários e agenda · Engenharia Agrícola Unipampa</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="horarios.html#agenda">
  <!-- A agenda agora faz parte de horarios.html. Links antigos (?t=2026.2&s=...) viram ?t=2026.2&a=... -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.has('s')) { p.set('a', p.get('s')); p.delete('s'); }
      var q = p.toString();
      location.replace('horarios.html' + (q ? '?' + q : '') + '#agenda');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=horarios.html#agenda">
</head>
<body>
  <p>A agenda agora fica na página <a href="horarios.html#agenda">Horários</a>.</p>
</body>
