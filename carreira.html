<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carreira · Engenharia Agrícola Unipampa</title>
  <meta name="description" content="Campos de atuação do Engenheiro Agrícola: máquinas, irrigação, construções rurais, energia, pós-colheita e geotecnologias. Descubra qual área combina com você.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body data-title-key="cr.title">
  <header id="site-header"></header>
  <main>
    <section class="career-hero">
      <div class="container">
        <div class="reveal" style="max-width:880px">
          <span class="eyebrow" data-i18n="cr.eyebrow"></span>
          <h1><span data-i18n="cr.h1a"></span><br><span class="rotator" id="rotator" aria-live="polite"></span></h1>
          <p class="lead" data-i18n="cr.lead"></p>
          <div class="btn-row">
            <a class="btn btn-primary" href="#quiz"><span data-icon="compass"></span><span data-i18n="cr.cta.quiz"></span></a>
            <a class="btn btn-ghost" href="#areas"><span data-i18n="cr.cta.areas"></span><span data-icon="arrow"></span></a>
          </div>
        </div>
        <div class="field-scene reveal" data-delay="2" aria-hidden="true">
          <svg viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd4f2"/><stop offset="1" stop-color="#e9f6ff"/></linearGradient>
              <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fa3e0"/><stop offset="1" stop-color="#7cc4f2"/></linearGradient>
            </defs>
            <rect width="1200" height="380" fill="url(#sky)"/>
            <circle class="sun" cx="1050" cy="70" r="40" fill="#f8c94a"/>
            <g class="cloud" opacity=".95"><ellipse cx="120" cy="70" rx="50" ry="16" fill="#fff"/><ellipse cx="145" cy="58" rx="28" ry="16" fill="#fff"/></g>
            <g class="cloud c2" opacity=".8"><ellipse cx="300" cy="110" rx="38" ry="12" fill="#fff"/><ellipse cx="320" cy="101" rx="20" ry="12" fill="#fff"/></g>
            <!-- wind turbines -->
            <g transform="translate(860 150)"><rect x="-2" width="5" height="110" fill="#eef2f4"/><g class="blade"><path d="M0 0 L-4 -48 L4 -48 Z M0 0 L40 26 L36 32 Z M0 0 L-40 26 L-36 32 Z" fill="#fbfcfd"/><circle r="5" fill="#cfd8dc"/></g></g>
            <g transform="translate(940 170)"><rect x="-2" width="4" height="90" fill="#eef2f4"/><g class="blade" style="animation-duration:8s"><path d="M0 0 L-3 -38 L3 -38 Z M0 0 L32 21 L29 26 Z M0 0 L-32 21 L-29 26 Z" fill="#fbfcfd"/><circle r="4" fill="#cfd8dc"/></g></g>
            <!-- hills -->
            <path d="M0 250 C 150 200, 320 230, 480 210 S 800 180, 1000 205 S 1150 215, 1200 205 V380 H0 Z" fill="#9ccc72"/>
            <path d="M0 290 C 200 260, 400 285, 620 270 S 1000 255, 1200 265 V380 H0 Z" fill="#6bb04f"/>
            <!-- river -->
            <path d="M0 345 C 200 325, 380 360, 600 340 S 980 320, 1200 345 V380 H0 Z" fill="url(#river)" opacity=".9"/>
            <!-- dam -->
            <rect x="560" y="322" width="16" height="30" fill="#90a4ae"/>
            <!-- greenhouse -->
            <g transform="translate(700 228)"><path d="M0 40 V18 a40 18 0 0 1 80 0 V40 Z" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/><path d="M20 40V6M40 40V0M60 40V6" stroke="#90caf9" stroke-width="1.5"/><g fill="#66bb6a"><circle cx="12" cy="34" r="4"/><circle cx="30" cy="34" r="4"/><circle cx="50" cy="34" r="4"/><circle cx="68" cy="34" r="4"/></g></g>
            <!-- silos & barn -->
            <g transform="translate(1000 190)">
              <rect x="0" y="16" width="34" height="74" fill="#d5dbe0"/><path d="M0 16 a17 14 0 0 1 34 0" fill="#b0bec5"/>
              <rect x="40" y="30" width="30" height="60" fill="#cfd8dc"/><path d="M40 30 a15 12 0 0 1 30 0" fill="#a7b4bb"/>
              <path d="M36 4 h40" stroke="#78909c" stroke-width="2"/>
              <rect x="78" y="50" width="70" height="40" fill="#c0392b"/><path d="M72 52 L113 24 L154 52 Z" fill="#922b21"/><rect x="104" y="64" width="18" height="26" fill="#fff" opacity=".85"/>
            </g>
            <!-- solar farm -->
            <g transform="translate(380 245)">
              <g><path d="M0 18 L10 0 H50 L40 18 Z" fill="#1f4e79"/><path d="M5 9 H45" stroke="#6fa8dc"/></g>
              <g transform="translate(60 0)"><path d="M0 18 L10 0 H50 L40 18 Z" fill="#1f4e79"/><path d="M5 9 H45" stroke="#6fa8dc"/></g>
              <g transform="translate(120 0)"><path d="M0 18 L10 0 H50 L40 18 Z" fill="#1f4e79"/><path d="M5 9 H45" stroke="#6fa8dc"/></g>
            </g>
            <!-- irrigation pivot -->
            <g transform="translate(40 268)">
              <line x1="0" y1="0" x2="260" y2="0" stroke="#90a4ae" stroke-width="4"/>
              <path d="M0 0V26M65 0V26M130 0V26M195 0V26M260 0V26" stroke="#78909c" stroke-width="3"/>
              <g fill="#4fc3f7"><circle class="drop" cx="30" cy="5" r="3"/><circle class="drop d2" cx="95" cy="5" r="3"/><circle class="drop d3" cx="160" cy="5" r="3"/><circle class="drop d2" cx="225" cy="5" r="3"/><circle class="drop" cx="62" cy="5" r="3"/><circle class="drop d3" cx="128" cy="5" r="3"/><circle class="drop" cx="192" cy="5" r="3"/></g>
            </g>
            <!-- crops -->
            <g id="crops" fill="#2f6e22"></g>
            <!-- drone -->
            <g class="drone"><g transform="translate(560 120)">
              <rect x="0" y="0" width="34" height="10" rx="4" fill="#37474f"/><line x1="-14" y1="-2" x2="48" y2="-2" stroke="#37474f" stroke-width="2.5"/>
              <ellipse cx="-14" cy="-4" rx="12" ry="2.5" fill="#90a4ae"/><ellipse cx="48" cy="-4" rx="12" ry="2.5" fill="#90a4ae"/>
              <path d="M17 10 l-30 90 h60 Z" fill="#f8c94a" opacity=".16"/>
            </g></g>
            <!-- tractor -->
            <g class="tractor" style="animation-duration:22s"><g transform="translate(0 300) scale(1.3)">
              <rect x="10" y="8" width="44" height="18" rx="3" fill="#2e7d32"/>
              <rect x="34" y="-10" width="20" height="20" rx="2" fill="#2e7d32"/><rect x="38" y="-6" width="12" height="10" fill="#d6eaf8"/>
              <rect x="16" y="-2" width="4" height="10" fill="#555"/>
              <g class="wheel"><circle cx="46" cy="28" r="13" fill="#263238"/><circle cx="46" cy="28" r="5" fill="#f8c94a"/><rect x="45" y="16" width="2" height="24" fill="#455a64"/></g>
              <g class="wheel"><circle cx="16" cy="32" r="8" fill="#263238"/><circle cx="16" cy="32" r="3" fill="#f8c94a"/><rect x="15" y="25" width="2" height="14" fill="#455a64"/></g>
              <rect x="-26" y="20" width="30" height="8" fill="#e0701f"/><path d="M-26 28 l-4 8 M-16 28 l-4 8 M-6 28 l-4 8" stroke="#555" stroke-width="2"/>
            </g></g>
          </svg>
        </div>
      </div>
    </section>

    <!-- WHY -->
    <section class="section">
      <div class="container">
        <div class="reveal">
          <span class="eyebrow" data-i18n="cr.w.eyebrow"></span>
          <h2 data-i18n="cr.w.h2"></h2>
          <p class="lead" data-i18n="cr.w.lead"></p>
        </div>
        <div class="grid grid-4" id="why" style="margin-top:24px"></div>
      </div>
    </section>

    <!-- CHAIN -->
    <section class="section" style="background:var(--bg-2)">
      <div class="container">
        <div class="center reveal">
          <span class="eyebrow" data-i18n="cr.c.eyebrow"></span>
          <h2 data-i18n="cr.c.h2"></h2>
          <p class="lead" data-i18n="cr.c.lead"></p>
        </div>
        <div class="chain" id="chain"></div>
      </div>
    </section>

    <!-- AREAS -->
    <section class="section" id="areas">
      <div class="container">
        <div class="reveal">
          <span class="eyebrow" data-i18n="cr.a.eyebrow"></span>
          <h2 data-i18n="cr.a.h2"></h2>
          <p class="lead" data-i18n="cr.a.lead"></p>
        </div>
        <div class="grid grid-3" id="area-cards" style="margin-top:24px"></div>
      </div>
    </section>

    <!-- QUIZ -->
    <section class="section" id="quiz" style="background:var(--bg-2)">
      <div class="container">
        <div class="center reveal">
          <span class="eyebrow" data-i18n="cr.q.eyebrow"></span>
          <h2 data-i18n="cr.q.h2"></h2>
          <p class="lead" data-i18n="cr.q.lead"></p>
        </div>
        <div class="card quiz" id="quiz-box" style="margin-top:24px"></div>
      </div>
    </section>

    <!-- WHERE -->
    <section class="section">
      <div class="container">
        <div class="reveal">
          <span class="eyebrow" data-i18n="cr.e.eyebrow"></span>
          <h2 data-i18n="cr.e.h2"></h2>
          <p class="lead" data-i18n="cr.e.lead"></p>
        </div>
        <div class="employers" id="employers" style="margin-top:24px"></div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section" style="background:var(--bg-2)">
      <div class="container center">
        <div class="reveal">
          <span class="eyebrow" data-i18n="cr.s.eyebrow"></span>
          <h2 data-i18n="cr.s.h2"></h2>
          <p class="lead" data-i18n="cr.s.lead"></p>
        </div>
        <div class="skills-cloud reveal" id="skills" style="margin-top:24px"></div>
      </div>
    </section>

    <!-- JOIN -->
    <section class="section">
      <div class="container">
        <div class="card reveal" style="padding:36px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--gold)));color:var(--brand-ink);border:0">
          <h2 data-i18n="cr.j.h2"></h2>
          <p style="font-size:1.1rem;max-width:70ch" data-i18n="cr.j.p"></p>
          <div class="btn-row">
            <a class="btn" style="background:var(--surface);color:var(--ink)" href="https://sisu.mec.gov.br/" target="_blank" rel="noopener" data-i18n="cr.j.sisu"></a>
            <a class="btn" style="background:transparent;color:inherit;border-color:currentColor" href="matriz.html" data-i18n="cr.j.matrix"></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="data/courses.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/carreira.js"></script>
</body>
</html>
